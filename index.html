<!DOCTYPE html>
<html lang="km"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>កាលវិភាគតាមផ្នែក</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--ink:#1c2430;--sub:#6b7686;--line:#e6e9ef;--brand:#2f6fed;--r:14px;--sh:0 1px 2px rgba(20,25,40,.04),0 8px 24px rgba(20,25,40,.06)}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Khmer',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
#app{max-width:1280px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:19px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tabs{display:flex;gap:5px;background:#fff;padding:5px;border-radius:12px;box-shadow:var(--sh)}
.tab{padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--sub);white-space:nowrap}.tab.on{background:var(--brand);color:#fff}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;color:var(--ink)}
.btn:hover{background:#f0f2f6}.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.lbl{font-weight:700;font-size:16px;min-width:170px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.dept{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dh{padding:9px 12px;color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.nb{background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:8px;padding:3px 10px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600}
.row{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.row .sl{width:50px;color:var(--sub);font-size:12px;flex-shrink:0;padding-top:5px}
.ppl{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:30px}
.pp{display:inline-flex;align-items:center;border-radius:14px;padding:3px 9px;font-size:12.5px;font-weight:600}
small{font-weight:400;color:var(--sub);font-size:11.5px;margin-left:3px}
.addp{border:1px dashed #c3c9d3;border-radius:14px;padding:2px 11px;cursor:pointer;color:var(--sub)}.addp:hover{background:#f0f2f6}
.adding{flex:1;min-width:150px}
input.ed{width:100%;padding:5px;border:1px solid var(--brand);border-radius:7px;font-family:inherit;font-size:12.5px}
.mdept{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
table{border-collapse:collapse;font-size:12.5px}
.mt{width:100%}.mt th{background:#f7f8fb;color:var(--sub);padding:6px 2px;border-bottom:1px solid var(--line);min-width:30px;font-weight:600}
.mt td{padding:2px;border-bottom:1px solid var(--line);text-align:center}
.mt .nmc{text-align:left;white-space:nowrap;position:sticky;left:0;background:#fff;padding:5px 8px;font-weight:600;min-width:130px;z-index:1;border-right:1px solid var(--line)}
.mt th.nmc{background:#f7f8fb}.mt .we{background:#fdf0f0;color:#e05252}.mt .td{background:#fff3b0}
.pp{color:var(--ink)}
.dlist{display:flex;flex-direction:column;gap:12px}.dr{display:flex;align-items:stretch}
.dr .dh{width:190px;flex-shrink:0;justify-content:flex-start;gap:8px}.grip{cursor:grab;opacity:.85}
.mv b{cursor:pointer;margin-left:4px;font-size:11px;padding:2px 5px;background:rgba(255,255,255,.25);border-radius:5px}
.dcols{flex:1;display:flex;flex-wrap:wrap}.dcol{flex:1;min-width:200px;padding:10px 12px;border-left:1px solid var(--line)}
.dcol .sl{color:var(--sub);font-size:12px;font-weight:600;padding-bottom:6px}
@media(max-width:640px){.dr{flex-direction:column}.dr .dh{width:auto}.dcol{border-left:0;border-top:1px solid var(--line)}}
.tg{min-height:30px;min-width:70px;border-radius:8px;border:1px dashed #c3c9d3;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}.tg:hover{background:#f0f2f6}.dt td{text-align:left;vertical-align:top;padding:5px 8px}.dt td.nmc{vertical-align:top}
.mc{min-height:26px;min-width:28px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;letter-spacing:1px}.mc:hover{outline:1px solid var(--line)}
.pop{position:fixed;z-index:50;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.22);padding:6px;display:flex;gap:5px}
.cnt{width:100%}.cnt th{background:#f7f8fb;color:var(--sub);padding:8px 4px;border-bottom:1px solid var(--line)}.cnt td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);cursor:pointer;font-weight:600;background:#fff}
.x{color:#e05252;cursor:pointer;font-weight:700;margin-left:5px}
.names{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.nm{border:1px solid var(--line);border-radius:20px;padding:5px 12px;background:#fbfcfe;cursor:pointer}
.add{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.add input{flex:1;min-width:120px;padding:8px;border:1px solid var(--line);border-radius:9px;font-family:inherit}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2430;color:#fff;padding:9px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none}.toast.s{opacity:1}
.pn{display:none}.pn.on{display:block}
@media print{@page{size:landscape;margin:8mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.top,.nav,.toast,.chips,.no-p,.pop{display:none!important}.card{box-shadow:none}}
</style></head><body><div id="app">
<div class="top"><h1>កាលវិភាគតាមផ្នែក</h1>
<div class="tabs"><div class="tab on" data-p="day">ប្រចាំថ្ងៃ</div><div class="tab" data-p="month">ប្រចាំខែ</div><div class="tab" data-p="staff">បុគ្គលិក</div><div class="tab" data-p="count">ចំនួនវេន</div></div></div>

<div class="pn on" id="p-day"><div class="card">
<div class="nav"><button class="btn" id="dPrev">‹</button><div class="lbl" id="dLbl"></div><button class="btn" id="dNext">›</button>
<input type="date" class="btn" id="dPick"><button class="btn" id="dToday">ថ្ងៃនេះ</button><button class="btn no-p" onclick="print()">🖨️ ព្រីន</button></div>
<div class="dlist" id="dGrid"></div></div></div>

<div class="pn" id="p-month"><div class="card">
<div class="nav"><button class="btn" id="mPrev">‹</button><div class="lbl" id="mLbl"></div><button class="btn" id="mNext">›</button>
<button class="btn" id="mToday">ខែនេះ</button><button class="btn no-p" onclick="print()">🖨️ ព្រីន</button>
<button class="btn" id="mv1">មើលតាមថ្ងៃ (រាយឈ្មោះ)</button><button class="btn" id="mv2">បំពេញវេន (តាមបុគ្គលិក)</button>
<span style="color:var(--sub);font-size:12px">«បំពេញវេន» → ជ្រើសឈ្មោះ → ចុចលើវេនដែលធ្វើការ</span></div>
<div id="mWrap"></div></div></div>

<div class="pn" id="p-staff"><div class="card"><div style="font-weight:700;margin-bottom:8px">គ្រប់គ្រងផ្នែក</div>
<div class="names" id="depList"></div>
<form class="add" id="depForm"><input id="depIcon" placeholder="😀" style="flex:0 0 60px;text-align:center"><input id="depName" placeholder="ឈ្មោះផ្នែកថ្មី — ឧ. Lab, ឱសថស្ថាន">
<input type="color" id="depColor" value="#2f6fed" style="flex:0 0 46px;padding:2px"><button class="btn p">+ បន្ថែមផ្នែក</button></form></div>
<div class="card"><div style="font-weight:700;margin-bottom:8px">បុគ្គលិកតាមផ្នែក <small>(ចុចលើឈ្មោះដើម្បីកែតួនាទី)</small></div><div class="chips" id="sChips" style="margin-bottom:6px"></div>
<div class="names" id="sNames"></div>
<form class="add" id="sForm"><input id="sNew" placeholder="ឈ្មោះ — ឧ. Dr.Sok Dara"><input id="sRole" list="roleList" placeholder="តួនាទី (ស្រេចចិត្ត)"><datalist id="roleList"></datalist><button class="btn p">+ បន្ថែម</button></form></div></div>

<div class="pn" id="p-count"><div class="card"><div class="nav"><button class="btn" id="cPrev">‹</button><div class="lbl" id="cLbl"></div><button class="btn" id="cNext">›</button></div><div id="cWrap"></div></div></div>
</div><div class="toast" id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,doc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBdzGaQHj_lRdLARHAIruY-Ha_USzKMiwk",authDomain:"sopheak-visal-clinic.firebaseapp.com",projectId:"sopheak-visal-clinic",storageBucket:"sopheak-visal-clinic.firebasestorage.app",messagingSenderId:"89092779964",appId:"1:89092779964:web:775cb69d9f88580ddd45b9"};
const USE_FB=cfg.apiKey.indexOf('PASTE')!==0, LS='deptScheduleApp_v1';
const ref=USE_FB?doc(initializeFirestore(initializeApp(cfg),{localCache:persistentLocalCache()}),'deptSchedule','main'):null;

const MN=['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];
const DW=['អាទិត្យ','ចន្ទ','អង្គារ','ពុធ','ព្រហស្បតិ៍','សុក្រ','សៅរ៍'];
const cols2=()=>[{id:'c1',label:'ព្រឹក'},{id:'c3',label:'យប់'}];
const MIDW={id:'midwife',name:'ឆ្មប',icon:'🤰',color:'#d6336c'};
const DEF=()=>[{id:'doctor',name:'គ្រូពេទ្យ',icon:'🩺',color:'#2f6fed'},{id:'nurse',name:'Nurse',icon:'💉',color:'#0f9d7a'},MIDW,{id:'eye',name:'ភ្នែក',icon:'👁️',color:'#8a4fd6'},{id:'dental',name:'ធ្មេញ',icon:'🦷',color:'#e07b00'}].map(d=>({...d,cols:cols2()}));
const ord=c=>({c1:1,c2:2,c3:3}[c.id]||9);
let S={v:2,depts:DEF(),staff:{},sched:{}};S.depts.forEach(d=>S.staff[d.id]=[]);
let day=new Date(),my=day.getFullYear(),mm=day.getMonth()+1,cy=my,cm=mm,staffDept='doctor',editing=false,pop=null,mview='staff',pDept=null,pName=null;
const $=id=>document.getElementById(id),p2=n=>(n<10?'0':'')+n,ds=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(d,c)=>d+'__'+c;
const get=(date,dp,col)=>{const v=(S.sched[date]||{})[key(dp,col)];return Array.isArray(v)?v:(v?[v]:[])};
const setL=(date,dp,col,l)=>{(S.sched[date]=S.sched[date]||{})[key(dp,col)]=l};
const role=(dp,n)=>{const s=(S.staff[dp]||[]).find(x=>x.n===n);return s?s.r:''};
const lab=(dp,n)=>esc(n)+(role(dp,n)?'<small>('+esc(role(dp,n))+')</small>':'');
const dept=id=>S.depts.find(d=>d.id===id);
function save(){if(USE_FB)setDoc(ref,S).catch(e=>toast('⚠ '+e.message));else try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('⚠ '+e.message)}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('s'),2000)}

function load(d){const mig=!d.v;S={v:2,depts:d.depts||DEF(),staff:d.staff||{},sched:d.sched||{}};
  S.depts.forEach(x=>S.staff[x.id]=(S.staff[x.id]||[]).map(s=>typeof s==='string'?{n:s,r:''}:s));
  if(mig){
    if(!dept('midwife')){S.depts.push({...MIDW,cols:cols2()});S.staff.midwife=[]}
    S.depts.forEach(D=>{const used=Object.keys(S.sched).some(k=>get(k,D.id,'c2').length);if(!used)D.cols=D.cols.filter(c=>c.id!=='c2')});
    save()}
  if(!dept(staffDept))staffDept=(S.depts[0]||{}).id}
if(USE_FB){
  onSnapshot(ref,snap=>{if(snap.exists())load(snap.data());else save();if(!editing)renderAll()},
    e=>{$('dGrid').innerHTML='<div>⚠ មិនអាចភ្ជាប់ Firestore: '+esc(e.message)+'</div>'});
}else{
  try{const r=localStorage.getItem(LS);if(r)load(JSON.parse(r))}catch(e){}
  renderAll();
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.pn').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');$('p-'+t.dataset.p).classList.add('on');renderAll()});
function renderAll(){renderDay();renderMonth();renderStaff();renderCount()}

/* ---------- shift column toggle (afternoon) ---------- */
const noonBtn=D=>'<button class="nb no-p" data-noon="'+D.id+'">'+(D.cols.some(c=>c.id==='c2')?'− រសៀល':'+ រសៀល')+'</button>';
function noon(id){const D=dept(id);
  if(D.cols.some(c=>c.id==='c2')){if(!confirm('លុបវេនរសៀល? (ទិន្នន័យចាស់រក្សាទុក)'))return;D.cols=D.cols.filter(c=>c.id!=='c2')}
  else{D.cols.push({id:'c2',label:'រសៀល'});D.cols.sort((a,b)=>ord(a)-ord(b))}
  save();renderAll()}

/* ---------- DAY ---------- */
function shiftDay(n){day=new Date(day.getFullYear(),day.getMonth(),day.getDate()+n);renderDay()}
$('dPrev').onclick=()=>shiftDay(-1);$('dNext').onclick=()=>shiftDay(1);$('dToday').onclick=()=>{day=new Date();renderDay()};
$('dPick').onchange=e=>{if(e.target.value){const p=e.target.value.split('-');day=new Date(+p[0],+p[1]-1,+p[2]);renderDay()}};
function renderDay(){
  const d=ds(day);$('dLbl').textContent=DW[day.getDay()]+' '+day.getDate()+' '+MN[day.getMonth()]+' '+day.getFullYear();$('dPick').value=d;
  $('dGrid').innerHTML=S.depts.map(D=>'<div class="dept dr" draggable="true" data-id="'+D.id+'"><div class="dh" style="background:'+D.color+'"><span class="grip no-p" title="ទាញដើម្បីផ្លាស់ទី">⋮⋮</span><span style="flex:1">'+D.icon+' '+esc(D.name)+'</span><span class="mv no-p"><b data-up="'+D.id+'">▲</b><b data-dn="'+D.id+'">▼</b></span></div><div class="dcols">'+
    D.cols.map(c=>'<div class="dcol"><div class="sl">'+esc(c.label)+'</div><div class="ppl">'+(get(d,D.id,c.id).map(n=>'<span class="pp" style="background:'+D.color+'1f">'+lab(D.id,n)+'</span>').join('')||'<span style="color:#c3c9d3">—</span>')+'</div></div>').join('')+'</div></div>').join('');
}
let dragId=null;const dg=$('dGrid');
dg.addEventListener('dragstart',e=>{const b=e.target.closest('.dr');if(!b)return;dragId=b.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
dg.addEventListener('dragover',e=>{if(dragId)e.preventDefault()});
dg.addEventListener('drop',e=>{e.preventDefault();const b=e.target.closest('.dr');if(!b||!dragId||b.dataset.id===dragId){dragId=null;return}
  const f=S.depts.findIndex(x=>x.id===dragId),t=S.depts.findIndex(x=>x.id===b.dataset.id);dragId=null;
  const m=S.depts.splice(f,1)[0];S.depts.splice(t,0,m);save();renderAll()});
function moveDept(id,k){const i=S.depts.findIndex(x=>x.id===id),j=i+k;if(j<0||j>=S.depts.length)return;const m=S.depts.splice(i,1)[0];S.depts.splice(j,0,m);save();renderAll()}
function addEdit(el){
  editing=true;const d=el.dataset.d,dp=el.dataset.dp,col=el.dataset.c,cur=get(d,dp,col);
  const opts=(S.staff[dp]||[]).filter(s=>!cur.includes(s.n)),id='dl'+Date.now();
  el.className='adding';
  el.innerHTML='<input class="ed" list="'+id+'" placeholder="វាយ/ជ្រើសឈ្មោះ..."><datalist id="'+id+'">'+opts.map(s=>'<option value="'+esc(s.n)+'">'+esc(s.r)+'</option>').join('')+'</datalist>';
  const inp=el.querySelector('input');inp.focus();let done=false;
  const fin=(cancel,again)=>{if(done)return;done=true;editing=false;
    const v=inp.value.trim();
    if(!cancel&&v){if(cur.includes(v))toast('⚠ '+v+' មានរួចហើយ');
      else{S.staff[dp]=S.staff[dp]||[];if(!S.staff[dp].some(s=>s.n===v))S.staff[dp].push({n:v,r:''});setL(d,dp,col,cur.concat(v));save();toast('រក្សាទុករួចរាល់ ✓')}}
    renderAll();
    if(again){const b=[...document.querySelectorAll('.pn.on .addp')].find(x=>x.dataset.d===d&&x.dataset.dp===dp&&x.dataset.c===col);if(b)addEdit(b)}};
  inp.addEventListener('keydown',ev=>{if(ev.isComposing||ev.keyCode===229)return;
    if(ev.key==='Enter'){ev.preventDefault();fin(false,true)}else if(ev.key==='Escape'){ev.preventDefault();fin(true)}});
  inp.addEventListener('blur',()=>setTimeout(()=>fin(false),120));
}

/* ---------- MONTH (staff as rows, departments stacked) ---------- */
$('mPrev').onclick=()=>{mm--;if(mm<1){mm=12;my--}renderMonth()};$('mNext').onclick=()=>{mm++;if(mm>12){mm=1;my++}renderMonth()};
$('mToday').onclick=()=>{const n=new Date();my=n.getFullYear();mm=n.getMonth()+1;renderMonth()};
const sh=c=>({c1:'ព',c2:'រ',c3:'យ'}[c.id]||c.label.charAt(0));
$('mv1').onclick=()=>{mview='day';renderMonth()};$('mv2').onclick=()=>{mview='staff';pName=null;renderMonth()};
function renderMonthDay(){
  const n=new Date(my,mm,0).getDate(),t=ds(new Date());
  $('mWrap').innerHTML=S.depts.map(D=>{
    let h='<div class="mdept"><div class="dh" style="background:'+D.color+'"><span>'+D.icon+' '+esc(D.name)+'</span>'+noonBtn(D)+'</div><div style="overflow-x:auto"><table class="mt dt"><thead><tr><th class="nmc">ថ្ងៃ</th>'+D.cols.map(c=>'<th>'+esc(c.label)+'</th>').join('')+'</tr></thead><tbody>';
    for(let i=1;i<=n;i++){const d=my+'-'+p2(mm)+'-'+p2(i),w=new Date(my,mm-1,i).getDay(),cl=(w==0||w==6?'we ':'')+(d===t?'td':'');
      h+='<tr class="'+cl+'"><td class="nmc '+cl+'">'+i+'/'+p2(mm)+'<small>'+DW[w]+'</small></td>'+D.cols.map(c=>{const a='data-d="'+d+'" data-dp="'+D.id+'" data-c="'+c.id+'"';
        return '<td><div class="ppl">'+(get(d,D.id,c.id).map(nm=>'<span class="pp" style="background:'+D.color+'1f">'+lab(D.id,nm)+'</span>').join('')||'<span style="color:#c3c9d3">—</span>')+'</div></td>'}).join('')+'</tr>'}
    return h+'</tbody></table></div></div>'}).join('');
}
function renderMonth(){
  $('mLbl').textContent=MN[mm-1]+' '+my;$('mv1').className='btn'+(mview==='day'?' p':'');$('mv2').className='btn'+(mview==='staff'?' p':'');
  return mview==='day'?renderMonthDay():renderMonthStaff();
}
function renderMonthStaff(){
  if(!dept(pDept))pDept=(S.depts[0]||{}).id;
  if(!pName||!dept(pDept)){
    $('mWrap').innerHTML='<div class="mdept" style="padding:14px"><div style="font-weight:700;margin-bottom:8px">ជ្រើសរើសឈ្មោះបុគ្គលិក</div><div class="chips" id="pChips" style="margin-bottom:10px">'+chips(pDept)+'</div><div class="names">'+
      ((S.staff[pDept]||[]).map(s=>'<span class="nm" data-pn="'+esc(s.n)+'">'+lab(pDept,s.n)+'</span>').join('')||'<span style="color:var(--sub)">មិនទាន់មានឈ្មោះ — បន្ថែមនៅផ្ទាំង «បុគ្គលិក»</span>')+'</div></div>';
    return}
  const D=dept(pDept),n=new Date(my,mm,0).getDate(),t=ds(new Date()),r=role(D.id,pName);let tot=0,rows='';
  for(let i=1;i<=n;i++){const d=my+'-'+p2(mm)+'-'+p2(i),w=new Date(my,mm-1,i).getDay(),cl=(w==0||w==6?'we ':'')+(d===t?'td':'');
    const on=D.cols.filter(c=>get(d,D.id,c.id).includes(pName));tot+=on.length;
    rows+='<tr class="'+cl+'"><td class="nmc '+cl+'">'+i+'/'+p2(mm)+'<small>'+DW[w]+'</small></td><td>'+(on.length&&r?esc(r):'')+'</td>'+D.cols.map(c=>{const a=on.includes(c);
      return '<td><div class="tg" data-tg="'+c.id+'" data-d="'+d+'" data-dp="'+D.id+'"'+(a?' style="background:'+D.color+'33;color:'+D.color+';border:1px solid '+D.color+'">✓':'>')+'</div></td>'}).join('')+'</tr>'}
  $('mWrap').innerHTML='<div class="mdept"><div class="dh" style="background:'+D.color+'"><span>'+D.icon+' '+esc(D.name)+' · '+esc(pName)+(r?' ('+esc(r)+')':'')+' · សរុប '+tot+' វេន</span><span><button class="nb no-p" data-pback="1">← ប្ដូរឈ្មោះ</button> '+noonBtn(D)+'</span></div><div style="overflow-x:auto"><table class="mt dt"><thead><tr><th class="nmc">ថ្ងៃ</th><th>តួនាទី</th>'+
    D.cols.map(c=>'<th>'+esc(c.label)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function closePop(){if(pop){pop.remove();pop=null}}
function showPop(cell){
  closePop();const d=cell.dataset.d,dp=cell.dataset.dp,nm=cell.dataset.n,D=dept(dp);
  pop=document.createElement('div');pop.className='pop';
  pop.innerHTML=D.cols.map(c=>'<button class="btn'+(get(d,dp,c.id).includes(nm)?' p':'')+'" data-c="'+c.id+'">'+esc(c.label)+'</button>').join('');
  const r=cell.getBoundingClientRect();pop.style.top=(r.bottom+4)+'px';pop.style.left=Math.max(4,Math.min(r.left,innerWidth-230))+'px';
  pop.onclick=e=>{const b=e.target.closest('button');if(!b)return;const l=get(d,dp,b.dataset.c);
    setL(d,dp,b.dataset.c,l.includes(nm)?l.filter(x=>x!==nm):l.concat(nm));save();renderMonth();
    const nc=[...document.querySelectorAll('#mWrap .mc')].find(x=>x.dataset.d===d&&x.dataset.dp===dp&&x.dataset.n===nm);if(nc)showPop(nc)};
  document.body.appendChild(pop);
}
addEventListener('scroll',closePop,true);

/* ---------- GLOBAL CLICKS ---------- */
document.addEventListener('click',e=>{const t=e.target;
  if(t.dataset.up||t.dataset.dn){moveDept(t.dataset.up||t.dataset.dn,t.dataset.up?-1:1);return}
  if(t.dataset.pback){pName=null;renderMonth();return}
  const ch=t.closest('#pChips .chip');if(ch){pDept=ch.dataset.dp;renderMonth();return}
  const pn=t.closest('[data-pn]');if(pn){pName=pn.dataset.pn;renderMonth();return}
  const tg=t.closest('[data-tg]');if(tg){const l=get(tg.dataset.d,tg.dataset.dp,tg.dataset.tg);setL(tg.dataset.d,tg.dataset.dp,tg.dataset.tg,l.includes(pName)?l.filter(x=>x!==pName):l.concat(pName));save();renderAll();return}
  if(t.dataset.noon){noon(t.dataset.noon);return}
  if(t.dataset.rm!==undefined){setL(t.dataset.d,t.dataset.dp,t.dataset.c,get(t.dataset.d,t.dataset.dp,t.dataset.c).filter(x=>x!==t.dataset.rm));save();renderAll();return}
  const a=t.closest('.addp');if(a&&!editing){closePop();addEdit(a);return}
  const m=t.closest('.mc');if(m){showPop(m);return}
  if(!t.closest('.pop'))closePop()});

/* ---------- STAFF ---------- */
const chips=cur=>S.depts.map(D=>'<div class="chip" data-dp="'+D.id+'" style="'+(D.id===cur?'background:'+D.color+';color:#fff;border-color:'+D.color:'')+'">'+D.icon+' '+esc(D.name)+'</div>').join('');
$('sChips').onclick=e=>{const c=e.target.closest('.chip');if(c){staffDept=c.dataset.dp;renderStaff()}};
function renderDeps(){
  $('depList').innerHTML=S.depts.map(D=>'<span class="nm" style="border-color:'+D.color+'">'+D.icon+' '+esc(D.name)+' <span class="x" data-del="'+D.id+'">×</span></span>').join('')||'<span style="color:var(--sub)">មិនទាន់មានផ្នែក</span>'}
$('depList').onclick=e=>{const id=e.target.dataset.del;if(!id)return;const D=dept(id);
  if(!confirm('លុបផ្នែក "'+D.name+'"? (ទិន្នន័យវេនចាស់ៗរក្សាទុកក្នុងឯកសារ ប៉ុន្តែលែងបង្ហាញ)'))return;
  S.depts=S.depts.filter(x=>x.id!==id);if(!dept(staffDept))staffDept=(S.depts[0]||{}).id;
  save();renderAll();toast('លុបផ្នែករួចរាល់ ✓')};
$('depForm').onsubmit=e=>{e.preventDefault();const n=$('depName').value.trim();if(!n){toast('សូមបញ្ចូលឈ្មោះផ្នែក');return}
  const id='d'+Date.now();S.depts.push({id,name:n,icon:$('depIcon').value.trim()||'🏥',color:$('depColor').value,cols:cols2()});S.staff[id]=[];
  if(!staffDept)staffDept=id;$('depName').value='';$('depIcon').value='';save();renderAll();toast('បន្ថែមផ្នែករួចរាល់ ✓')};
function renderStaff(){renderDeps();
  $('sChips').innerHTML=chips(staffDept);const l=S.staff[staffDept]||[];
  $('sForm').style.display=dept(staffDept)?'':'none';
  $('roleList').innerHTML=[...new Set(S.depts.flatMap(D=>(S.staff[D.id]||[]).map(s=>s.r).filter(Boolean)))].map(r=>'<option value="'+esc(r)+'">').join('');
  $('sNames').innerHTML=l.length?l.map((s,i)=>'<span class="nm" data-i="'+i+'">'+lab(staffDept,s.n)+' <span class="x" data-x="'+i+'">×</span></span>').join(''):'<span style="color:var(--sub)">មិនទាន់មានឈ្មោះ</span>';
}
$('sNames').onclick=e=>{const L=S.staff[staffDept];
  if(e.target.dataset.x!==undefined){if(confirm('លុបឈ្មោះនេះ? (វេនចាស់នៅដដែល)')){L.splice(+e.target.dataset.x,1);save();renderAll()}return}
  const nm=e.target.closest('.nm');if(nm){const s=L[+nm.dataset.i],r=prompt('តួនាទីរបស់ '+s.n+' (ទុកទទេ = គ្មាន)៖',s.r);if(r!==null){s.r=r.trim();save();renderAll()}}};
$('sForm').onsubmit=e=>{e.preventDefault();const v=$('sNew').value.trim();if(!v)return;
  const L=S.staff[staffDept]=S.staff[staffDept]||[];if(!L.some(s=>s.n===v))L.push({n:v,r:$('sRole').value.trim()});$('sNew').value='';$('sRole').value='';save();renderAll();toast('បន្ថែមរួចរាល់ ✓')};

/* ---------- COUNT ---------- */
$('cPrev').onclick=()=>{cm--;if(cm<1){cm=12;cy--}renderCount()};$('cNext').onclick=()=>{cm++;if(cm>12){cm=1;cy++}renderCount()};
function renderCount(){
  $('cLbl').textContent=MN[cm-1]+' '+cy;const pre=cy+'-'+p2(cm);
  $('cWrap').innerHTML=S.depts.map(D=>{const m={};
    Object.keys(S.sched).filter(k=>k.indexOf(pre)===0).forEach(d=>D.cols.forEach(c=>get(d,D.id,c.id).forEach(raw=>{
      const n=raw.split('(')[0].trim();if(!n)return;const o=m[n]=m[n]||{day:0,night:0};if(c.label.indexOf('យប់')!==-1)o.night++;else o.day++})));
    const rows=Object.keys(m).sort((a,b)=>(m[b].day+m[b].night)-(m[a].day+m[a].night));
    return '<h3 style="color:'+D.color+';margin:14px 0 6px">'+D.icon+' '+esc(D.name)+'</h3>'+(rows.length?'<table class="cnt"><thead><tr><th style="text-align:left">ឈ្មោះ</th><th>ថ្ងៃ</th><th>យប់</th><th>សរុប</th></tr></thead><tbody>'+
      rows.map(n=>'<tr><td style="text-align:left">'+lab(D.id,n)+'</td><td>'+m[n].day+'</td><td>'+m[n].night+'</td><td><b>'+(m[n].day+m[n].night)+'</b></td></tr>').join('')+'</tbody></table>':'<div style="color:var(--sub)">មិនមានវេនទេ</div>')}).join('');
}
</script></body></html>
