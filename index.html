$('qrBox').onclick=async e=>{const t=e.target;if(t.dataset.qs){qrOn[t.dataset.qs]=!qrOn[t.dataset.qs];renderQR()}else if(t.dataset.qp)printQR([t.dataset.qp]);else if(t.id==='qrGen')printQR(['__all']);else if(t.id==='qrAll')printQR(qrList().slice(1).map(x=>x.id));else if(t.dataset.qc){const it=qrList().find(x=>x.id===t.dataset.qc);try{await navigator.clipboard.writeText(it.url);toast('ចម្លងរួចរាល់ ✓')}catch(x){toast('⚠ ចម្លងមិនបាន')}}};
renderQR();

$('cPrev').onclick=()=>{cm--;if(cm<1){cm=12;cy--}renderCount()};$('cNext').onclick=()=>{cm++;if(cm>12){cm=1;cy++}renderCount()};
function renderCount(){
  $('cLbl').textContent=MN[cm-1]+' '+cy;const pre=cy+'-'+p2(cm);
  $('cWrap').innerHTML=S.depts.map(D=>{const m={};
    Object.keys(S.sched).filter(k=>k.indexOf(pre)===0).forEach(d=>D.cols.forEach(c=>get(d,D.id,c.id).forEach(raw=>{
      const n=raw.split('(')[0].trim();if(!n)return;const o=m[n]=m[n]||{day:0,night:0};if(c.label.indexOf('យប់')!==-1)o.night++;else o.day++})));
    const rows=Object.keys(m).sort(nameCmp);
    return '<h3 style="color:'+D.color+';margin:14px 0 6px">'+D.icon+' '+esc(D.name)+'</h3>'+(rows.length?'<table class="cnt"><thead><tr><th style="text-align:left">ឈ្មោះ</th><th>ថ្ងៃ</th><th>យប់</th><th>សរុប</th></tr></thead><tbody>'+
      rows.map(n=>'<tr><td style="text-align:left">'+lab(D.id,n)+'</td><td>'+m[n].day+'</td><td>'+m[n].night+'</td><td><b>'+(m[n].day+m[n].night)+'</b></td></tr>').join('')+'</tbody></table>':'<div style="color:var(--sub)">មិនមានវេនទេ</div>')}).join('');
}
